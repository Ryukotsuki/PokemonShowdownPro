appId: com.pokemonshowdownpro.desktop
productName: Pokemon Showdown Pro
asar: false
npmRebuild: false
toolsets:
  # Static AppImage runtime; no system libfuse2 is needed by the launcher.
  appimage: '1.0.3'
afterPack: scripts/after-pack.cjs
directories:
  output: dist
files:
  - app/**/*
  - scripts/**/*
  - tests/fixtures.cjs
  - build/showdex/**/*
  - build/update-runtime/**/*
  - build/upstream/**/*
  - vendor/browser-addons/**/*
  - vendor/showdex/package.json
  - vendor/showdex/LICENSE
  - vendor-versions.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!**/.git/**'
  - '!**/node_modules/electron/**'
  - '!**/_metadata/**'
win:
  icon: app/assets/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: PokemonShowdownPro-${version}-windows-${arch}.${ext}
nsis:
  artifactName: PokemonShowdownPro-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
publish:
  provider: github
  owner: Ryukotsuki
  repo: PokemonShowdownPro
  releaseType: release
mac:
  icon: app/assets/icons/icon.icns
  category: public.app-category.games
  # Seal the finished bundle without requiring a Developer ID certificate.
  # Hardened runtime library validation is incompatible with this ad-hoc identity.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  binaries:
    - Contents/Resources/app/build/update-runtime/node
  target: [dmg, zip]
  artifactName: PokemonShowdownPro-${version}-macos-${arch}.${ext}
dmg:
  contents:
    # Copy the indexing exclusion before the app to reduce background volume activity.
    - x: 0
      y: 0
      type: file
      path: app/assets/dmg/.metadata_never_index
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  icon: app/assets/icons/icon.png
  category: Game
  executableName: pokemon-showdown-pro
  syncDesktopName: true
  executableArgs: [--no-sandbox, --class=pokemon-showdown-pro]
  desktop:
    entry:
      StartupWMClass: pokemon-showdown-pro
      StartupNotify: 'true'
  target: [AppImage, tar.gz]
  artifactName: PokemonShowdownPro-${version}-linux-${arch}.${ext}
appImage:
  artifactName: PokemonShowdownPro-${version}-${arch}.${ext}
