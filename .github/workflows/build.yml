name: Build apps

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to build
        required: false
        type: string
        default: ''
      release_tag:
        description: Require this tag to match package.json
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            arch: x64
          - platform: macos
            runner: macos-15-intel
            arch: x64
          - platform: macos
            runner: macos-15
            arch: arm64
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check release version
        run: node scripts/check-release-tag.cjs
      - name: Install dependencies
        run: npm ci
      - name: Fetch pinned upstream sources
        run: npm run fetch:vendor
      - name: Build Showdex
        run: npm run setup
      - name: Test
        run: npm test
      - name: Verify early theme startup
        if: runner.os != 'Linux'
        run: node node_modules/electron/cli.js scripts/audit-startup-theme.cjs
      - name: Verify early theme startup on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/electron/cli.js scripts/audit-startup-theme.cjs --no-sandbox
      - name: Verify Showdex startup before page load
        if: runner.os != 'Linux'
        run: node node_modules/electron/cli.js scripts/audit-showdex-startup.cjs
      - name: Verify Showdex startup before page load on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/electron/cli.js scripts/audit-showdex-startup.cjs --no-sandbox
      - name: Download browser add-ons
        run: npm run download:addons
      - name: Verify app updater downloads
        if: runner.os != 'Linux'
        run: node node_modules/electron/cli.js scripts/audit-app-updates.cjs
      - name: Verify app updater downloads on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/electron/cli.js scripts/audit-app-updates.cjs --no-sandbox
      - name: Package apps
        run: npm run dist -- --${{ matrix.arch }}
      - name: Prepare app update metadata
        run: node scripts/prepare-update-metadata.cjs
      - name: Verify in-app portable replacement
        if: runner.os != 'Linux'
        run: node node_modules/electron/cli.js scripts/audit-portable-updates.cjs
      - name: Verify in-app portable replacement on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/electron/cli.js scripts/audit-portable-updates.cjs --no-sandbox
      - name: Verify packaged app
        if: runner.os != 'Linux'
        run: npm run verify:package
      - name: Verify packaged app on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          xvfb-run -a npm run verify:package
      - name: Upload package verification diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Package-verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/package-verification-*/
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate checksums
        run: node scripts/release-checksums.cjs
      - name: Upload apps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PokemonShowdownPro-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.sha256
            dist/*.blockmap
            dist/latest*.yml
            dist/update-mac-*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
